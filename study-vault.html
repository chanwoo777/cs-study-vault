<title>CS Study Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  --paper:#FAF8F4;--surface:#FFFFFF;--sunk:#F3EFE8;--side:#F5F1EA;--ink:#2B2824;--ink-2:#5C564E;--ink-3:#8C8478;--line:#EAE4DA;--line-2:#D9D0C2;
  --pen:#1F6F78;--pen-strong:#185A62;--pen-ink:#FFFFFF;--pen-soft:#E4F0EF;--hl-bg:rgba(250,205,110,.5);
  --ok:#2E7A57;--ok-soft:#E5F1E9;--warn:#9E6216;--warn-soft:#FBEEDA;--bad:#B2463C;--bad-soft:#F8E5E1;
  --shadow:0 1px 2px rgba(70,52,30,.05),0 4px 18px rgba(70,52,30,.06);
  --r:12px;
  --f-ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-read:"Literata",Georgia,"Apple SD Gothic Neo","Malgun Gothic","Noto Serif KR",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#1B1916;--surface:#24211D;--sunk:#2C2823;--side:#201D1A;--ink:#EDE7DD;--ink-2:#C0B7A9;--ink-3:#91897C;--line:#35302A;--line-2:#463F36;
  --pen:#72BCC1;--pen-strong:#8CCDD1;--pen-ink:#132022;--pen-soft:#1F3436;--hl-bg:rgba(226,176,84,.28);
  --ok:#80C79E;--ok-soft:#1E3226;--warn:#E3AF68;--warn-soft:#3A2D18;--bad:#EE8D80;--bad-soft:#3D2420;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#1B1916;--surface:#24211D;--sunk:#2C2823;--side:#201D1A;--ink:#EDE7DD;--ink-2:#C0B7A9;--ink-3:#91897C;--line:#35302A;--line-2:#463F36;
  --pen:#72BCC1;--pen-strong:#8CCDD1;--pen-ink:#132022;--pen-soft:#1F3436;--hl-bg:rgba(226,176,84,.28);
  --ok:#80C79E;--ok-soft:#1E3226;--warn:#E3AF68;--warn-soft:#3A2D18;--bad:#EE8D80;--bad-soft:#3D2420;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
a{color:var(--pen);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-3)}
.small{font-size:13px}
.hl{background:linear-gradient(transparent 55%,var(--hl-bg) 55%,var(--hl-bg) 90%,transparent 90%);padding-inline:3px}
[hidden]{display:none!important}

.shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.topbar{display:none}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding-block:20px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
main{overflow:auto;padding-block:32px 88px;padding-inline:clamp(16px,4vw,56px)}
.wrap{max-width:1060px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
@media (max-width:860px){
  .shell{display:block;height:auto}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:16px}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line)}
  .shell.menu-open .side{display:flex}
  main{overflow:visible;padding-block:22px 72px}
}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand-name{font-weight:600;font-size:16px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:var(--r);color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--sunk);text-decoration:none}
.nav a.on{background:var(--pen-soft);color:var(--pen)}
.badge{font-family:var(--f-mono);font-size:12px;min-width:22px;text-align:center;border-radius:999px;padding:0 7px;background:var(--sunk);color:var(--ink-2)}
.badge.hot{background:var(--hl-bg);color:var(--ink)}
.side-h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.side-course{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 10px;border-radius:var(--r);color:var(--ink)}
.side-course:hover{background:var(--sunk);text-decoration:none}
.side-course.on{background:var(--pen-soft)}
.side-course .mini{grid-column:1/-1;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.side-course .mini span{display:block;height:100%;background:var(--ok)}
.side details summary{cursor:pointer;list-style:none}
.side details summary::-webkit-details-marker{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.side-foot label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.status-line{font-size:12px;color:var(--ink-3)}

h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:18px;line-height:1.3;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.page-head{display:flex;flex-direction:column;gap:8px}
.lede{color:var(--ink-2);max-width:62ch;margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.learning{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 45%,transparent)}
.pill.mastered,.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.pen{color:var(--pen);background:var(--pen-soft);border-color:transparent}
.pill.hl{background:var(--hl-bg);border-color:transparent;color:var(--ink)}

input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 9px;font-size:14px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-3)}
.field input,.field select{color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);color:var(--ink-3);width:1%;white-space:nowrap}

.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.banner.info{background:var(--pen-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* home */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.today-item{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.big{font-size:40px;line-height:1;font-weight:500;min-width:1.6ch}
.today-item p{margin:0 0 8px;color:var(--ink-2)}
.courses{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.course-row{display:grid;grid-template-columns:minmax(160px,1.4fr) minmax(120px,1fr) minmax(140px,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.course-row:last-child{border-bottom:0}
.course-row .name{font-weight:600;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
@media (max-width:700px){.course-row{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--pen);text-decoration:none}
.chip .mono{color:var(--ink-3);font-size:12px}
.howto{border-top:1px solid var(--line);padding-top:16px;color:var(--ink-2);font-size:14px}
.howto ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* inbox */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.drop.over{border-color:var(--pen);background:var(--pen-soft)}
.defaults{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.src{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.src-head{display:flex;gap:12px;align-items:flex-start}
.ftype{font-size:11px;text-transform:uppercase;border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;color:var(--ink-2);margin-top:2px}
.src-name{flex:1;min-width:0;overflow-wrap:anywhere}
.src-name a{font-weight:600;color:var(--ink)}
.src-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.plan{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.plan p{margin:0}
.job{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.job-item{display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.dot.run{background:var(--pen);animation:pulse 1.2s ease-in-out infinite}
.dot.done{background:var(--ok)}
.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.err{color:var(--bad);margin:0;font-size:14px}
.report{font-size:14px;display:flex;flex-direction:column;gap:3px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--bad-soft);padding:8px 10px;border-radius:var(--r)}

/* roadmap */
.progress-line{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.progress-line .bar{width:180px}
.lecture{display:flex;flex-direction:column;gap:10px}
.lecture-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lecture-h .mono{color:var(--ink-3)}
.kterm{color:var(--ink-3);font-size:13px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}
.recall{font-size:14px;color:var(--ink-2)}
.flow{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.flow svg{display:block}
.flow .n rect{fill:var(--surface);stroke:var(--line-2)}
.flow .n.learning rect{stroke:var(--pen)}
.flow .n.mastered rect{fill:var(--ok-soft);stroke:var(--ok)}
.flow .n text{fill:var(--ink);font:12px var(--f-ui)}
.flow .n text.num{fill:var(--ink-3);font-family:var(--f-mono)}
.flow .e{fill:none;stroke:var(--line-2);stroke-width:1.2}
.flow .n{cursor:pointer}
.flow .n:hover rect{stroke:var(--pen)}
details.plain>summary{cursor:pointer;color:var(--ink-2);font-size:14px}
.exam-form{display:flex;flex-direction:column;gap:10px}
.exam-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}

/* concept doc */
.crumbs{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.doc-head{display:flex;flex-direction:column;gap:8px}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:40px;align-items:start}
@media (max-width:1100px){.doc-grid{grid-template-columns:minmax(0,1fr)}}
.doc{font-family:var(--f-read);font-size:17px;line-height:1.7;max-width:70ch;min-width:0}
.doc h2{font-family:var(--f-ui);font-size:20px;margin:2em 0 .5em}
.doc h3{font-family:var(--f-ui);font-size:16px;margin:1.5em 0 .4em}
.doc p{margin:.65em 0}
.doc ul,.doc ol{padding-left:1.4em}
.doc li{margin:.25em 0}
.doc pre{font:13.5px/1.55 var(--f-mono);background:var(--sunk);padding:12px 14px;border-radius:var(--r);overflow-x:auto}
.doc code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 4px;border-radius:3px}
.doc pre code{background:none;padding:0;font-size:inherit}
.doc .tablewrap{margin:1em 0;font-family:var(--f-ui)}
.doc details{border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;margin:.8em 0;background:var(--surface)}
.doc details>summary{cursor:pointer;font-family:var(--f-ui);font-size:14px;color:var(--ink-2)}
.doc details[open]>summary{margin-bottom:6px}
.doc blockquote{margin:1em 0;padding-left:14px;border-left:2px solid var(--line-2);color:var(--ink-2)}
.doc hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.callout{margin:1.1em 0;border-radius:var(--r);padding:12px 16px;background:var(--sunk)}
.callout>.c-title{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
details.callout>summary.c-title{cursor:pointer}
.callout .c-lead{font-weight:600;margin-top:4px}
.callout .c-body>:first-child{margin-top:.3em}
.callout .c-body>:last-child{margin-bottom:0}
.c-summary{background:var(--pen-soft)} .c-summary>.c-title{color:var(--pen)}
.c-warning{background:var(--warn-soft)} .c-warning>.c-title{color:var(--warn)}
.c-misconception{background:var(--bad-soft)} .c-misconception>.c-title{color:var(--bad)}
.c-check{background:var(--ok-soft)} .c-check>.c-title{color:var(--ok)}
.c-theorem,.c-definition,.c-lemma,.c-corollary{background:var(--surface);border:1px solid var(--line-2)}
.wl-missing{border-bottom:1px dotted var(--ink-3);color:var(--ink-2)}
sup.fnref a{font-family:var(--f-mono);font-size:11px;padding:0 2px}
.footnotes{border-top:1px solid var(--line);margin-top:2.2em;padding-top:10px;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2)}
.footnotes ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.footnotes li .mono{color:var(--ink-3);margin-right:6px}
.footnotes li.flash{background:var(--hl-bg)}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.doc-side{display:flex;flex-direction:column;gap:18px;font-size:14px;position:sticky;top:0}
.doc-side h3{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:6px}
.doc-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sched li{display:flex;justify-content:space-between;gap:8px}
.qcards{display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui)}
.qcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qcard>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;align-items:start}
.qcard>summary::-webkit-details-marker{display:none}
.qcard .cid{font-family:var(--f-mono);font-size:12px;color:var(--pen);padding-top:3px}
.qcard .q{font-family:var(--f-read);font-size:16px}
.qcard .q>:first-child{margin-top:0}.qcard .q>:last-child{margin-bottom:0}
.qcard .ans{border-top:1px solid var(--line);padding:10px 14px 12px 44px;font-family:var(--f-read);font-size:16px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.mynotes textarea{min-height:120px;font-family:var(--f-read);font-size:16px}
.sample-note{background:var(--hl-bg);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* review */
.rv{max-width:720px;margin-inline:auto;width:100%;display:flex;flex-direction:column;gap:18px}
.rv-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.rv-q{font-family:var(--f-read);font-size:19px;line-height:1.6}
.rv-q>:first-child{margin-top:0}.rv-q>:last-child{margin-bottom:0}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conf.flash{background:var(--hl-bg);border-radius:var(--r);padding:4px}
.seg{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:14px}
.seg.on{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.hints{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hint{background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.verdict{font-size:20px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.ref{border-top:1px solid var(--line);padding-top:12px;font-family:var(--f-read);font-size:16px}

/* marks & renaming */
.markbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mk{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font:500 13px/1.3 var(--f-ui);cursor:pointer;color:var(--ink-2);white-space:nowrap}
.mk:hover{border-color:var(--ink-3);color:var(--ink)}
.mk.on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mk.on-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.mk.sm{padding:2px 9px;font-size:12px}
.doc h2.sec-h2{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.secmarks{display:inline-flex;gap:6px;opacity:.75}
.sec-h2:hover .secmarks,.secmarks:focus-within,.secmarks:has(.on-ok,.on-warn){opacity:1}
.doc h2.needs>span:first-child{background:linear-gradient(transparent 62%,var(--warn-soft) 62%)}
.flash-sec{animation:flashsec 1.8s ease-out}
@keyframes flashsec{0%,40%{background:var(--hl-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash-sec{animation:none}}
.title-row{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.title-in{font-size:22px;font-weight:600;flex:1 1 320px;max-width:640px}
button.chip{cursor:pointer;font:inherit;font-size:13px}

<script>

'use strict';

const LIB = {

const FENCE = '```';
const PHASES = ['initial', 'r1', 'r2', 'r3', 'maintain'];
const TYPES = ['definition', 'theorem', 'algorithm', 'data-structure', 'technique', 'model', 'contrast', 'steps', 'bridge'];
const CARD_TYPES = ['recall', 'why', 'apply', 'discriminate', 'justify', 'trace', 'explain', 'translate', 'counterexample'];

const S = {
  db: null, assets: null, sample: null, downloads: null, limits: null,
  env: 'loading', configLoaded: false, config: null,

/* ---------- small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const slug = s => String(s || '').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const utf8 = s => new TextEncoder().encode(s).length;

const clone = o => JSON.parse(JSON.stringify(o ?? null));
function todayStr(d = new Date()) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }

/* ---------- config & concept helpers ---------- */
const semesters = () => S.config?.semesters || [];
const currentSem = () => S.config?.currentSemester || semesters()[0]?.id || '';
const allCourses = () => semesters().flatMap(s => (s.courses || []).map(c => ({ ...c, semester: s.id })));
const courseById = id => allCourses().find(c => c.id === id);
const courseName = id => courseById(id)?.name || id || 'Unsorted';
function semOrder() { const cur = currentSem(); return [...semesters()].sort((a, b) => a.id === cur ? -1 : b.id === cur ? 1 : (a.id < b.id ? 1 : -1)); }
function nextExam(courseId) { const t = todayStr(); return ((courseById(courseId)?.exams) || []).filter(e => e.date && e.date >= t).sort((a, b) => a.date < b.date ? -1 : 1)[0] || null; }
const conceptsOf = course => S.order.get(course) || [];
const cardKey = (cid, n) => `${cid}~C${n}`;
const numLabel = c => S.num.has(c.id) ? pad2(S.num.get(c.id)) : '--';
function cardByKey(k) { const i = k.lastIndexOf('~C'); const c = S.concepts.get(k.slice(0, i)); return c ? { concept: c, card: (c.cards || []).find(x => x.n === Number(k.slice(i + 2))) } : {}; }
function mastery(c) {
  const cards = c.cards || []; if (!cards.length) return 'new';
  const rs = cards.map(k => S.reviews.get(cardKey(c.id, k.n)));
  if (!rs.some(r => r?.log?.some(e => !e.quiz))) return 'new';
  return rs.every(r => r && r.phase === 'maintain') ? 'mastered' : 'learning';
}
const prereqsMastered = c => (c.prerequisites || []).every(p => !S.concepts.has(p) || mastery(S.concepts.get(p)) === 'mastered');
const fringe = course => conceptsOf(course).filter(c => mastery(c) !== 'mastered' && prereqsMastered(c));
const markOf = id => S.marks.get(id) || null;
const moreParts = c => Object.values(markOf(c.id)?.sections || {}).filter(s => s.status === 'more').length;
const needsMore = c => markOf(c.id)?.status === 'more' || moreParts(c) > 0;
const isDone = c => markOf(c.id)?.status === 'complete';
const isUnmarked = c => { const m = markOf(c.id); return !m || (!m.status && !Object.keys(m.sections || {}).length); };
function markPills(c) {

function dueKeys(course) {
  const t = todayStr(), keys = [];

function nextDueDate() { const t = todayStr(); let min = null; for (const r of S.reviews.values()) if (r.nextDue && r.nextDue > t && (!min || r.nextDue < min)) min = r.nextDue; return min; }

}

function recompute() {
  S.order = new Map(); S.num = new Map(); S.cycles = new Set();

function lecturesOf(courseId) {
  const map = new Map();
  const get = n => { const k = n ?? 'none'; if (!map.has(k)) { const d = S.lectures.get(`${courseId}~${n}`) || {}; map.set(k, { n: n ?? null, title: d.title || '', beforeReading: d.beforeReading || [], freeRecall: d.freeRecall || '', concepts: [], sources: [] }); } return map.get(k); };

  for (const d of S.lectures.values()) if (d.course === courseId) get(d.n);

/* ---------- markdown rendering ---------- */
marked.use({

function flowSvg(list) {
  const ids = new Set(list.map(c => c.id)), depth = new Map();
  for (const c of list) depth.set(c.id, Math.max(-1, ...(c.prerequisites || []).filter(p => ids.has(p) && depth.has(p)).map(p => depth.get(p))) + 1);
  const cols = groupBy(list, c => depth.get(c.id)), W = 176, H = 34, GX = 54, GY = 12, pos = new Map();
  let maxRows = 0;
  for (const [d, cs] of cols) { cs.forEach((c, i) => pos.set(c.id, { x: d * (W + GX) + 4, y: i * (H + GY) + 4 })); maxRows = Math.max(maxRows, cs.length); }
  const width = (Math.max(...cols.keys()) + 1) * (W + GX) - GX + 8, height = maxRows * (H + GY) - GY + 8;
  const edges = [], nodes = [];
  for (const c of list) for (const p of c.prerequisites || []) if (pos.has(p)) { const a = pos.get(p), b = pos.get(c.id); const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2; edges.push(`<path class="e" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`); }
  for (const c of list) { const p = pos.get(c.id), ti = String(c.title || c.id), t = ti.length > 21 ? ti.slice(0, 20) + '…' : ti;
    nodes.push(`<g class="n ${mastery(c)}" data-act="go" data-view="concept" data-id="${esc(c.id)}"><title>${esc(c.title)}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5"/><text class="num" x="${p.x + 10}" y="${p.y + 21}">${numLabel(c)}</text><text x="${p.x + 34}" y="${p.y + 21}">${esc(t)}</text></g>`); }
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Prerequisite graph">${edges.join('')}${nodes.join('')}</svg>`;
}

    </div></div>`;
}

/* ---------- uploads ---------- */
const TEXT_EXT = ['md', 'markdown', 'txt', 'py', 'c', 'h', 'cpp', 'cc', 'hpp', 'java', 'js', 'ts', 'rs', 'go', 'sql', 'csv', 'json', 'tex', 'ipynb'];
function fileKindOf(name, type) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (type === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (/^image\/(png|jpeg|webp|gif)$/.test(type) || ['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) return 'image';
  if (TEXT_EXT.includes(ext) || /^text\//.test(type)) return 'text';
  return null;
}
function textType(ext) { return ext === 'md' || ext === 'markdown' ? 'text/markdown' : ext === 'csv' ? 'text/csv' : ext === 'json' || ext === 'ipynb' ? 'application/json' : 'text/plain'; }
async function toUtf8Blob(file, type) {
  const buf = await file.arrayBuffer();
  try { new TextDecoder('utf-8', { fatal: true }).decode(buf); return new Blob([buf], { type }); }
  catch { let txt; try { txt = new TextDecoder('euc-kr').decode(buf); } catch { txt = new TextDecoder('utf-8').decode(buf); } return new Blob([txt], { type }); }
}
function assetErr(e) { return ({ too_large: 'The file is over 20 MB.', unsupported_type: 'This file type can’t be stored.', quota_or_state: 'This page is out of storage space.', rate_limited: 'Too many uploads at once. Try again shortly.', not_granted: 'Uploading needs edit access to this page.' })[e?.code] || e?.message || 'Upload failed.'; }
async function addFiles(fileList, opts = {}) {
  if (!S.assets || !S.db) { toast('Uploading needs edit access to this page.'); return; }
  for (const f of [...fileList]) {
    const name = f.name || `pasted-${todayStr()}.png`, ext = (name.split('.').pop() || '').toLowerCase();
    const kind = fileKindOf(name, f.type || '');
    if (!kind) { toast(`${name}: this file type isn't supported. Save slides and documents as PDF first.`); continue; }
    if (f.size > 20 * 1048576) { toast(`${name} is over 20 MB. Split or compress it first.`); continue; }
    S.ui.uploading++; scheduleRender();
    try {
      let blob = f, type = f.type;
      if (kind === 'pdf') type = 'application/pdf';
      else if (kind === 'image') type = /^image\/(png|jpeg|webp|gif)$/.test(f.type) ? f.type : ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' })[ext];
      else { type = textType(ext); blob = await toUtf8Blob(f, type); }
      const up = await S.assets.upload(blob, { type });
      const d = S.ui.defaults, id = rid(), lecture = d.lecture === '' || d.lecture == null ? null : Number(d.lecture);
      await S.db.doc('sources/' + id).set({ originalName: name, name: `${lecture != null ? pad2(lecture) : '90'}.${baseName(name)}`, fileKind: kind, contentType: up.contentType, assetId: up.id, sizeBytes: up.sizeBytes, course: d.course || '', kind: opts.kind || d.kind || '', lecture, status: 'new', createdAt: Date.now() });
      S.fileCache.set(id, blob);
    } catch (e) { toast(`${name}: ${assetErr(e)}`); }
    finally { S.ui.uploading--; scheduleRender(); }
  }
}

/* ---------- content extraction ---------- */
async function getBlob(src) {
  if (S.fileCache.has(src.id)) return S.fileCache.get(src.id);
  const res = await fetch('/_blob/' + src.assetId);
  if (!res.ok) throw new Error(`The stored file couldn't be read (${res.status}).`);
  const b = await res.blob(); S.fileCache.set(src.id, b); return b;
}
function splitText(text) {
  const parts = []; let buf = '';
  for (const para of text.split(/\n(?=\s*\n)/)) { if (buf && utf8(buf + para) > 12000) { parts.push(buf); buf = ''; } buf += para + '\n'; }
  if (buf.trim()) parts.push(buf);
  return parts.map((t, i) => ({ n: i + 1, text: t }));
}
function extractContent(src) {
  if (!S.contentCache.has(src.id)) S.contentCache.set(src.id, extractContentRaw(src).catch(e => { S.contentCache.delete(src.id); throw e; }));
  return S.contentCache.get(src.id);
}
async function extractContentRaw(src) {
  const blob = await getBlob(src); let content;
  if (src.fileKind === 'image') content = { mode: 'image', unit: 'image', pages: [{ n: 1, text: '', image: blob }], total: 1 };
  else if (src.fileKind === 'pdf') {
    await loadScript(LIB.pdfWorker); await loadScript(LIB.pdf);
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false, useSystemFonts: true }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); pages.push({ n: i, text: tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+\n/g, '\n').trim() }); }
    const avg = pages.reduce((a, p) => a + p.text.length, 0) / Math.max(1, pages.length);
    content = { mode: avg < 60 ? 'scan' : 'text', unit: 'p.', pages, total: pdf.numPages, pdf };
  } else { const text = await blob.text(); const pages = splitText(text); content = { mode: 'text', unit: 'part', pages, total: pages.length }; }
  return content;
}
async function pageImage(content, n) {
  const pg = content.pages.find(p => p.n === n); if (!pg) return null; if (pg.image) return pg.image; if (!content.pdf) return null;
  const page = await content.pdf.getPage(n), vp0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: Math.min(2.2, 1400 / vp0.width) });

/* ---------- review logic ---------- */
function interleave(keys) {
  const groups = [...groupBy(shuffle(keys), k => k.slice(0, k.lastIndexOf('~C'))).values()];
  const out = []; let last = null;
  while (groups.some(g => g.length)) {
    groups.sort((a, b) => b.length - a.length);
    const g = groups.find(g => g.length && g[0].slice(0, g[0].lastIndexOf('~C')) !== last) || groups.find(g => g.length);
    const k = g.shift(); out.push(k); last = k.slice(0, k.lastIndexOf('~C'));
  }
  return out;
}
function intervalDays(courseId) {
  const ex = nextExam(courseId); if (!ex) return 28;
  const R = daysUntil(ex.date);
  if (R <= 0) return 28; if (R <= 7) return Math.max(1, Math.round(R * 0.3)); if (R <= 30) return Math.max(1, Math.round(R * 0.2)); if (R <= 120) return Math.max(1, Math.round(R * 0.15)); return 28;
}
function clampToExam(date, courseId) { const ex = nextExam(courseId); if (!ex) return date; const before = addDays(ex.date, -1); return date >= ex.date && todayStr() < before ? before : date; }
function startSession(mode, keys) {
  if (!S.sample) { toast('Grading needs Claude, which isn’t available in this view.'); S.route = { view: 'review' }; render(); return; }
  keys = uniq(keys).filter(k => cardByKey(k).card);
  if (!keys.length) { toast('No cards to ask.'); return; }
  let q = interleave(keys);
  if (mode === 'review') { const near = k => { const ex = nextExam(cardByKey(k).concept.course); return ex && daysUntil(ex.date) <= 2; }; q = [...q.filter(k => !(near(k) && (S.reviews.get(k)?.phase || 'initial') === 'initial')), ...q.filter(k => near(k) && (S.reviews.get(k)?.phase || 'initial') === 'initial')]; }
  S.session = { mode, queue: q, prog: new Map(), stats: { attempts: 0, correct: 0, sureWrong: [] }, cur: null, done: false };
  S.route = { view: 'review' }; S.ui.menu = false; advance();
}
function advance() {
  const s = S.session; S.ui.confFlash = false;
  while (s.queue.length) { const k = s.queue.shift(); if (cardByKey(k).card) { s.cur = { key: k, stage: 'ask', conf: 0, hints: 0, answer: '', result: null }; render(); setTimeout(() => $('#ans')?.focus(), 0); return; } }
  s.cur = null; s.done = true; render();
}
async function logAttempt(key, ok, conf) {
  const s = S.session, { concept, card } = cardByKey(key);
  const r = clone(S.reviews.get(key)) || { card: `${concept.id}#C${card.n}`, concept: concept.id, course: concept.course, n: card.n, phase: 'initial', nextDue: todayStr(), created: todayStr(), log: [] };
  r.log = r.log || [];
  const entry = { d: todayStr(), p: r.phase, c: conf, ok: ok ? 1 : 0 };
  let note;
  if (s.mode === 'quiz') { entry.quiz = 1; entry.nd = r.nextDue; note = 'Quiz: schedule unchanged'; }
  else {
    const p = s.prog.get(key) || { correct: 0, wrong: false };
    if (ok) p.correct++; else p.wrong = true;
    const need = r.phase === 'initial' ? (card.long ? 1 : 3) : 1;
    if (ok && p.correct >= need) {
      const g = intervalDays(concept.course), before = r.phase;
      if (p.wrong) r.nextDue = clampToExam(addDays(todayStr(), Math.max(1, Math.floor(g / 2))), concept.course);
      else { r.phase = PHASES[Math.min(PHASES.indexOf(r.phase) + 1, PHASES.length - 1)]; r.nextDue = clampToExam(addDays(todayStr(), g), concept.course); }
      note = `${before} → ${r.phase} · next ${fmtDate(r.nextDue)}`;
    } else { s.queue.push(key); note = ok ? `Correct ${p.correct} of ${need}; it comes back this session` : 'It comes back later this session'; }
    entry.nd = r.nextDue; s.prog.set(key, p);
  }
  r.log.push(entry);
  try { await S.db.doc('reviews/' + key).set(r); S.reviews.set(key, r); } catch (e) { toast('The result couldn’t be saved.'); }
  return { note };
}
async function checkAnswer(giveUp) {
  const s = S.session, cur = s?.cur; if (!cur || cur.stage !== 'ask') return;
  cur.answer = $('#ans')?.value ?? cur.answer;
  if (giveUp && !cur.conf) cur.conf = 1;
  if (!cur.conf) { S.ui.confFlash = true; render(); toast('First pick how sure you are.'); return; }
  const { concept, card } = cardByKey(cur.key);
  cur.stage = 'grading'; render();
  let ok = false, missing = '', feedback = '';
  try {
    if (giveUp || !cur.answer.trim()) feedback = giveUp ? 'Marked as not known yet.' : 'No answer was written.';
    else if (cur.hints >= 4) feedback = 'The full solution was shown, so this counts as a miss.';
    else { const r = await S.sample.json(gradePrompt(concept, card, cur.answer), { modelTier: card.long ? 'default' : 'quick' }); ok = r?.correct === true; missing = String(r?.missing || ''); feedback = String(r?.feedback || ''); }
  } catch (e) { cur.stage = 'ask'; toast(sampleErr(e)); render(); return; }
  const forced = ok && cur.hints >= 2; if (forced) ok = false;
  const info = await logAttempt(cur.key, ok, cur.conf);
  s.stats.attempts++; if (ok) s.stats.correct++; if (!ok && cur.conf === 3) s.stats.sureWrong.push(cur.key);
  cur.result = { ok, missing, feedback, forced, ...info }; cur.stage = 'result'; render();
}

  subscribe('marks', false, q => { S.marks = new Map(docsOf(q).map(x => [x.id, x])); changed(); });
  render();
}
boot();
})();
</script>
